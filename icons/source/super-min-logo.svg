<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
  Super Min app icon.
  The icon is the page: edge to edge, with a single Liquid Glass toolbar floating over it.
  Drawn on the macOS icon grid (824px body inside a 1024px canvas).
  -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.5" stop-color="#5B4BF5"/>
      <stop offset="1" stop-color="#A23CF0"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="atmosphere" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <filter id="frost" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
      <feColorMatrix type="saturate" values="1.05"/>
    </filter>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#120A3A" flood-opacity="0.35"/>
    </filter>

    <filter id="barShadow" x="-20%" y="-60%" width="140%" height="260%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A0B5C" flood-opacity="0.4"/>
    </filter>

    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>

    <clipPath id="bar">
      <rect x="196" y="214" width="632" height="132" rx="66"/>
    </clipPath>

    <!-- light behind the page, reused (blurred harder) inside the glass -->
    <g id="glow">
      <circle cx="350" cy="300" r="170" fill="#61E3FF"/>
      <circle cx="730" cy="270" r="140" fill="#FF8AD8"/>
      <circle cx="640" cy="760" r="240" fill="#FF6FB5" opacity="0.55"/>
    </g>
  </defs>

  <g filter="url(#iconShadow)">
    <g clip-path="url(#body)">
      <rect x="100" y="100" width="824" height="824" fill="url(#page)"/>
      <use href="#glow" filter="url(#atmosphere)" opacity="0.75"/>
      <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    </g>
    <!-- hairline on the icon edge -->
    <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  </g>

  <!-- the floating glass toolbar -->
  <g filter="url(#barShadow)">
    <rect x="196" y="214" width="632" height="132" rx="66" fill="#FFFFFF" fill-opacity="0.01"/>
  </g>
  <g clip-path="url(#bar)">
    <rect x="100" y="100" width="824" height="824" fill="url(#page)"/>
    <use href="#glow" filter="url(#frost)" opacity="0.5"/>
    <rect x="196" y="214" width="632" height="132" fill="url(#glassFill)"/>
    <!-- specular streak along the top -->
    <ellipse cx="420" cy="222" rx="230" ry="26" fill="#FFFFFF" opacity="0.35" filter="url(#frost)"/>
  </g>
  <rect x="197.5" y="215.5" width="629" height="129" rx="64.5" fill="none" stroke="url(#glassEdge)" stroke-width="3"/>

  <!-- tabs inside the toolbar: a pinned tab and the current tab -->
  <circle cx="276" cy="280" r="26" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="334" y="254" width="300" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.62"/>
</svg>
